packages:
  - packages/*

catalog:
  typescript: 6.0.2

# New releases must age for one day before they are eligible for installation.
# Add narrowly scoped exceptions only when an urgent security fix cannot wait.
minimumReleaseAge: 1440

onlyBuiltDependencies:
  - esbuild

# Vite+ is intentionally scoped to pack/lint/fmt while package tests retain
# their current Vitest majors. These peers are not used by the node-mode tests.
peerDependencyRules:
  allowedVersions:
    "@vitest/browser-preview": "4.1.11"
    "@vitest/ui": "4.1.11"
    vite: "0.3.3"
