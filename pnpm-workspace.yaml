packages:
  - packages/*

engineStrict: true

# Resolve unreleased workspace peers during Changesets versioning.
linkWorkspacePackages: true

catalog:
  "@vitest/ui": 5.0.3
  typescript: 6.0.2
  vitest: 5.0.3

# New releases must age for one day before they are eligible for installation.
# Add narrowly scoped exceptions only when an urgent security fix cannot wait.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - unipls

allowBuilds:
  esbuild: true

# Vite+ uses its own version number for the bundled Vite alias.
peerDependencyRules:
  allowedVersions:
    vite: "1.1.0"
